name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        neo_version: ['21.1.219', '21.1.251', '21.1.265']
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.99.1'

      - name: Test and build native backend
        run: |
          cargo test --locked --manifest-path native/Cargo.toml
          cargo build --release --locked --manifest-path native/Cargo.toml
          mkdir -p src/main/resources/natives/linux-x86_64
          cp native/target/release/libphysicalist_native.so src/main/resources/natives/linux-x86_64/

      - name: Build with Gradle
        run: ./gradlew build -Pneo_version=${{ matrix.neo_version }}

      - name: Run server regression tests
        run: ./gradlew runGameTestServer -Pneo_version=${{ matrix.neo_version }} -x neoFormJoined1.21.1-20240808.144430DownloadAssets
